name: Build and Release Multi-Platform Executables

on:
  push:
    tags:
      - "sugang-v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows (.exe)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/sugang

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: apps/sugang/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PyQt6 requests beautifulsoup4 pyinstaller

      - name: Build Standalone Windows .exe
        run: |
          pyinstaller --noconfirm --onefile --windowed --name "DaejinSugangSuite" --add-data "targets.json;." gui_qt.py

      - name: Prepare Windows Binary
        shell: bash
        run: |
          mv dist/DaejinSugangSuite.exe dist/DaejinSugangSuite-Windows-x64.exe

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-binary
          path: apps/sugang/dist/DaejinSugangSuite-Windows-x64.exe
          if-no-files-found: error

  build-macos:
    name: Build macOS (.app / zip)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apps/sugang

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: apps/sugang/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PyQt6 requests beautifulsoup4 pyinstaller

      - name: Build macOS App Bundle
        run: |
          pyinstaller --noconfirm --windowed --onedir --name "DaejinSugangSuite" --add-data "targets.json:." gui_qt.py

      - name: Compress macOS .app bundle
        run: |
          cd dist
          ditto -c -k --sequesterRsrc --keepParent DaejinSugangSuite.app DaejinSugangSuite-macOS-AppleSilicon.zip

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-binary
          path: apps/sugang/dist/DaejinSugangSuite-macOS-AppleSilicon.zip
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Create GitHub Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          name: "대진대학교 수강신청 마스터 GUI ${{ github.ref_name }}"
          body: |
            ## 🎓 대진대학교 초고속 수강신청 마스터 GUI 배포판 (${{ github.ref_name }})

            설치 없이 바로 실행 가능한 Windows 및 macOS 단일 패키지입니다.

            ### 📦 다운로드 안내
            - **Windows 사용자**: `DaejinSugangSuite-Windows-x64.exe` 다운로드 후 더블클릭
            - **macOS 사용자 (M1/M2/M3/M4 Apple Silicon)**: `DaejinSugangSuite-macOS-AppleSilicon.zip` 다운로드 후 압축 해제하여 `.app` 실행

            ### ✨ 주요 기능
            1. **실시간 과목 검색 & 빈자리 옵저버**: 실시간 잔여석, 정렬, 1클릭 수강신청
            2. **정각 10:00:00 패킷 스나이퍼**: 서버 타임 밀리초 동기화 & 10시 정각 자동 신청
            3. **24시간 백그라운드 취소표 헌터**: 원하는 과목 빈자리 생길 때 0.01초 즉각 신청
            4. **내 수강신청 내역 & 장바구니 실시간 조회**
          files: |
            release-artifacts/DaejinSugangSuite-Windows-x64.exe
            release-artifacts/DaejinSugangSuite-macOS-AppleSilicon.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
