name: Offline tests and package build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.13"
          - os: windows-latest
            python: "3.11"
          - os: macos-latest
            python: "3.11"
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            apps/sugang/requirements-web.txt
            apps/library/requirements.txt
      - name: Install development and offline test dependencies
        run: python -m pip install -e ".[dev]" -r apps/sugang/requirements-web.txt -r apps/library/requirements.txt
      - name: Lint shared code and tests
        run: python -m ruff check src tests apps/library
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install browser test dependencies
        run: npm ci
      - name: Offline browser model and DOM tests
        run: npm test
      - name: Offline regression tests (no service startup)
        run: python -m pytest -q -W error
      - name: Compile all Python sources without executing applications
        run: python -m compileall -q src apps tests
      - name: Build shared Python package
        run: python -m build
      - name: Verify wheel in an isolated environment
        shell: python
        run: |
          import os
          import pathlib
          import subprocess
          import tempfile
          import venv

          wheels = list(pathlib.Path("dist").glob("*.whl"))
          assert len(wheels) == 1, wheels
          wheel = wheels[0].resolve()
          with tempfile.TemporaryDirectory() as directory:
              env_path = pathlib.Path(directory) / "venv"
              venv.EnvBuilder(with_pip=True).create(env_path)
              python = env_path / ("Scripts/python.exe" if os.name == "nt" else "bin/python")
              subprocess.run([
                  str(python), "-m", "pip", "install", "--no-index", "--no-deps", str(wheel)
              ], check=True)
              subprocess.run([
                  str(python), "-I", "-c",
                  "import daejin_tools; import sys; from importlib.metadata import version; "
                  "assert 'web_observer' not in sys.modules; print(version('daejin-tools'))"
              ], cwd=directory, check=True)
      - uses: actions/upload-artifact@v4
        with:
          name: python-dist-${{ matrix.os }}-${{ matrix.python }}
          path: dist/*
          if-no-files-found: error
