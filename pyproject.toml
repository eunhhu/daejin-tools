[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "daejin-tools"
version = "0.1.0"
description = "Shared foundation for independent Daejin University campus tools"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.urls]
Repository = "https://github.com/eunhhu/daejin-tools"
Issues = "https://github.com/eunhhu/daejin-tools/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-socket>=0.7,<1",
    "build>=1.2,<2",
    "ruff>=0.9,<1",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["daejin_tools*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-config --strict-markers --disable-socket"
required_plugins = ["pytest-socket>=0.7"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["apps/sugang"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "PLW1510"]
